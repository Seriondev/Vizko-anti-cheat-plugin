name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate project files
        run: |
          mkdir -p VizkoAntiCheat/src/main/java/id/vizko/anticheat
          mkdir -p VizkoAntiCheat/src/main/resources
          cd VizkoAntiCheat

          cat > pom.xml << 'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>id.vizko</groupId>
              <artifactId>VizkoAntiCheat</artifactId>
              <version>1.0.0</version>

              <properties>
                  <maven.compiler.source>21</maven.compiler.source>
                  <maven.compiler.target>21</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>26.3-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.1</version>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml << 'EOF'
          name: VizkoAntiCheat
          version: 1.0.0
          main: id.vizko.anticheat.ClientCheck
          api-version: '1.21'
          author: Vizko
          description: Cek client pemain saat join dan kick jika memakai mod terlarang.
          EOF

          cat > src/main/resources/config.yml << 'EOF'
          # Tunda pengecekan (dalam tick, 20 tick = 1 detik)
          check-delay-ticks: 40

          # Kick kalau client tidak mengirim brand sama sekali
          kick-if-no-brand: true

          # Brand client yang diblokir (partial match, huruf kecil tidak masalah)
          blocked-brands:
            - meteor
            - wurst
            - liquidbounce

          # Plugin channel yang menandakan mod terlarang
          blocked-channels:
            - meteor
            - wurst
            - impact

          # Channel dari mod freecam (isi sesuai hasil testing)
          freecam-channels:
            - freecam

          kick-message: "&cMod tidak diizinkan terdeteksi: &e%mods%\n&fCopot mod tersebut dulu, lalu connect lagi."
          checking-title: "&eMemeriksa client..."
          checking-subtitle: "&7Harap tunggu sebentar"
          EOF

          cat > src/main/java/id/vizko/anticheat/ClientCheck.java << 'EOF'
          package id.vizko.anticheat;

          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerJoinEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.plugin.messaging.PluginMessageListener;

          import java.nio.charset.StandardCharsets;
          import java.util.*;

          public final class ClientCheck extends JavaPlugin implements Listener, PluginMessageListener {

              private static final String BRAND_CHANNEL = "minecraft:brand";

              private final Map<UUID, String> brands = new HashMap<>();
              private final Map<UUID, Set<String>> channels = new HashMap<>();

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  getServer().getPluginManager().registerEvents(this, this);
                  getServer().getMessenger().registerIncomingPluginChannel(this, BRAND_CHANNEL, this);
                  getLogger().info("VizkoAntiCheat aktif.");
              }

              @Override
              public void onDisable() {
                  brands.clear();
                  channels.clear();
              }

              @Override
              public void onPluginMessageReceived(String channel, Player player, byte[] message) {
                  if (channel.equals(BRAND_CHANNEL)) {
                      String brand = new String(message, StandardCharsets.UTF_8)
                              .replaceAll("[^\\p{Print}]", "")
                              .trim();
                      brands.put(player.getUniqueId(), brand);
                  }
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent event) {
                  Player player = event.getPlayer();
                  UUID uuid = player.getUniqueId();

                  player.sendTitle(
                          color(getConfig().getString("checking-title", "&eMemeriksa client...")),
                          color(getConfig().getString("checking-subtitle", "&7Harap tunggu sebentar")),
                          10, 60, 10
                  );

                  channels.put(uuid, new HashSet<>(player.getListeningPluginChannels()));

                  long delay = getConfig().getLong("check-delay-ticks", 40L);
                  Bukkit.getScheduler().runTaskLater(this, () -> {
                      if (!player.isOnline()) return;
                      runCheck(player);
                  }, delay);
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {
                  UUID uuid = event.getPlayer().getUniqueId();
                  brands.remove(uuid);
                  channels.remove(uuid);
              }

              private void runCheck(Player player) {
                  UUID uuid = player.getUniqueId();
                  String brand = brands.getOrDefault(uuid, "");
                  Set<String> chans = channels.getOrDefault(uuid, Collections.emptySet());

                  List<String> found = new ArrayList<>();

                  if (brand.isEmpty()) {
                      if (getConfig().getBoolean("kick-if-no-brand", true)) {
                          found.add("client tidak merespons");
                      }
                  } else {
                      for (String blocked : getConfig().getStringList("blocked-brands")) {
                          if (brand.toLowerCase().contains(blocked.toLowerCase())) {
                              found.add("brand:" + brand);
                              break;
                          }
                      }
                  }

                  List<String> blockedChannels = new ArrayList<>(getConfig().getStringList("blocked-channels"));
                  blockedChannels.addAll(getConfig().getStringList("freecam-channels"));

                  for (String chan : chans) {
                      String lower = chan.toLowerCase();
                      for (String blocked : blockedChannels) {
                          if (lower.contains(blocked.toLowerCase())) {
                              found.add(chan);
                              break;
                          }
                      }
                  }

                  if (!found.isEmpty()) {
                      String mods = String.join(", ", found);
                      String msg = getConfig().getString("kick-message",
                              "&cMod tidak diizinkan terdeteksi: &e%mods%\n&fCopot mod tersebut dulu, lalu connect lagi.");
                      player.kickPlayer(color(msg.replace("%mods%", mods)));
                      getLogger().warning(player.getName() + " di-kick: " + mods);
                  }
              }

              private String color(String s) {
                  return ChatColor.translateAlternateColorCodes('&', s);
              }
          }
          EOF

      - name: Build with Maven
        working-directory: VizkoAntiCheat
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: VizkoAntiCheat
          path: VizkoAntiCheat/target/VizkoAntiCheat-1.0.0.jar
